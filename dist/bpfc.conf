# /etc/bpfc/bpfc.conf -- settings for bpfcd. See bpfc.conf(5).
# Changes take effect on `systemctl reload bpfcd` (state_dir needs a restart).

# Program files: <config_dir>/<interface>/<ingress|egress>/<priority>.bpfc
#config_dir = /etc/bpfc/interfaces.d

# What to do when a program bpfcd installed is removed or replaced by
# something else (tc, a manual bpfc run, a deleted clsact qdisc):
#   reinstall - put bpfcd's program back and log a warning
#   log       - log a warning, mark it in `bpfcctl status`, leave it alone
#               until the next reload
#on_external_change = reinstall

# Automatic reinstalls allowed per program per minute before bpfcd gives up
# (status "reinstall-limit") until the next reload. 0 = unlimited.
#reinstall_limit = 5

# Remove all managed programs when bpfcd stops. By default they stay
# attached, and a restarted bpfcd adopts them without reinstalling.
#remove_on_stop = no

# Directory for pinned eBPF maps (bpfc -m). Empty = bpfc's default, /sys/fs/bpf.
# Maps are shared by name across all programs that use this directory.
#map_dir =

# Seconds a single bpfc run may take before it is killed.
#compile_timeout = 30

# error, warning, info or debug
#log_level = info

#bpfc_path = /usr/sbin/bpfc

# Network namespaces have their own file, /etc/bpfc/netns/<name>/bpfc.conf,
# read by `bpfcd -n <name>` (bpfcd-netns@<name>.service). Without one, a
# namespace takes the settings above but not the paths. Only there:
#   netns_path = /run/netns/other   # namespace file or symlink to one
#   netns_veth = veth3f2a1c         # or: wherever this host veth's peer is
#state_dir = /run/bpfc
